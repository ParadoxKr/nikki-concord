<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" viewBox="0 0 760 308" role="img" aria-label="资源占用对比">
  <defs>
    <linearGradient id="heroStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="heroFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0.0"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Minimal outer frame -->
  <rect x="0.5" y="0.5" width="759" height="307" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Header -->
  <text x="24" y="32" font-size="14.5" font-weight="600" letter-spacing="-0.2" fill="#0f172a">资源占用对比</text>
  <text x="24" y="49" font-size="10.5" fill="#94a3b8">Linksys E8450 · OpenWrt 25.12.6 · 单位 MiB（越低越好）</text>

  <!-- Minimal Legend -->
  <g transform="translate(494, 24)">
    <rect x="0" y="3.75" width="14" height="2.5" rx="1.25" fill="url(#heroStroke)"/>
    <text x="20" y="9" font-size="11" font-weight="600" fill="#0f172a">Nikki Concord</text>

    <line x1="108" y1="5" x2="122" y2="5" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 2.5" stroke-linecap="round"/>
    <text x="128" y="9" font-size="11" font-weight="400" fill="#64748b">原版 Nikki + Mihomo</text>
  </g>

  <!-- Subtle header divider -->
  <line x1="24" y1="62" x2="736" y2="62" stroke="#edf0f3" stroke-width="1"/>

  <!-- Left Section: Memory RSS -->
  <text x="24" y="84" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#64748b">内存 RSS · Fake-IP + TUN 压测及日常观察</text>

  <line x1="56" y1="250.0" x2="480" y2="250.0" stroke="#d8dee4" stroke-width="1"/><text x="46" y="253.5" text-anchor="end" font-size="10" fill="#94a3b8">0</text><line x1="56" y1="212.0" x2="480" y2="212.0" stroke="#f0f2f5" stroke-width="1"/><text x="46" y="215.5" text-anchor="end" font-size="10" fill="#94a3b8">25</text><line x1="56" y1="174.0" x2="480" y2="174.0" stroke="#f0f2f5" stroke-width="1"/><text x="46" y="177.5" text-anchor="end" font-size="10" fill="#94a3b8">50</text><line x1="56" y1="136.0" x2="480" y2="136.0" stroke="#f0f2f5" stroke-width="1"/><text x="46" y="139.5" text-anchor="end" font-size="10" fill="#94a3b8">75</text><line x1="56" y1="98.0" x2="480" y2="98.0" stroke="#f0f2f5" stroke-width="1"/><text x="46" y="101.5" text-anchor="end" font-size="10" fill="#94a3b8">100</text>
  <text x="82.0" y="272" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">隔离空载</text><text x="206.0" y="272" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">压测峰值</text><text x="454.0" y="272" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">日常观察</text>

  <!-- Subtle range caps for daily use -->
  <line x1="454.0" y1="113.2" x2="454.0" y2="143.6" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  <line x1="454.0" y1="198.3" x2="454.0" y2="207.4" stroke="#0969da" stroke-width="5" stroke-linecap="round" opacity="0.22"/>

  <!-- Smooth area + curves -->
  <path d="M 82.0,225.3 C 123.3,225.3 164.7,221.8 206.0,221.8 L 206.0,250.0 L 82.0,250.0 Z" fill="url(#heroFill)"/>
  <path d="M 82.0,179.2 C 123.3,179.2 164.7,129.2 206.0,129.2" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3.5" stroke-linecap="round"/>
  <path d="M 82.0,225.3 C 123.3,225.3 164.7,221.8 206.0,221.8" fill="none" stroke="url(#heroStroke)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Quiet peak delta callout -->
  <line x1="206.0" y1="137.2" x2="206.0" y2="213.8" stroke="#0969da" stroke-width="1" stroke-dasharray="2 3" opacity="0.45"/>
  <text x="214.0" y="179.0" font-size="10.5" font-weight="600" fill="#0969da">峰值 -77%</text>

  <circle cx="82.0" cy="179.2" r="3.2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="82.0" y="167.2" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">46.58</text><circle cx="82.0" cy="225.3" r="4.2" fill="#0969da" stroke="#ffffff" stroke-width="2"/><text x="82.0" y="244.3" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0969da">16.23</text><circle cx="206.0" cy="129.2" r="3.2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="206.0" y="117.2" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">79.49</text><circle cx="206.0" cy="221.8" r="4.2" fill="#0969da" stroke="#ffffff" stroke-width="2"/><text x="206.0" y="240.8" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0969da">18.58</text><circle cx="454.0" cy="128.4" r="3.2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="454.0" y="107.4" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">70–90</text><circle cx="454.0" cy="202.9" r="4.2" fill="#0969da" stroke="#ffffff" stroke-width="2"/><text x="454.0" y="224.9" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0969da">28–34</text>

  <!-- Vertical hairline divider -->
  <line x1="504" y1="76" x2="504" y2="282" stroke="#edf0f3" stroke-width="1"/>

  <!-- Right Section: Flash Size -->
  <text x="528" y="84" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#64748b">闪存安装体积 · r27</text>

  <!-- Big editorial hero KPI -->
  <text x="528" y="132" font-size="34" font-weight="700" letter-spacing="-1.2" fill="#0969da">-46.2%</text>
  <text x="528" y="151" font-size="11.5" font-weight="500" fill="#64748b">减少 25.31 MiB</text>

  <!-- Sleek hairline bars -->
  <text x="528" y="186" font-size="11.5" font-weight="600" fill="#0f172a">Nikki Concord</text>
  <text x="732" y="186" text-anchor="end" font-size="11.5" font-weight="700" fill="#0969da">29.51 MiB</text>
  <rect x="528" y="194" width="204" height="6" rx="3" fill="#f1f5f9"/>
  <rect x="528" y="194" width="109.8" height="6" rx="3" fill="url(#heroStroke)"/>

  <text x="528" y="229" font-size="11.5" font-weight="400" fill="#64748b">原版 Mihomo</text>
  <text x="732" y="229" text-anchor="end" font-size="11.5" font-weight="500" fill="#64748b">54.82 MiB</text>
  <rect x="528" y="237" width="204" height="6" rx="3" fill="#f1f5f9"/>
  <rect x="528" y="237" width="204.0" height="6" rx="3" fill="#94a3b8" opacity="0.55"/>

  <text x="528" y="272" font-size="10" fill="#94a3b8">未压缩安装文件 · 不含系统依赖</text>
</svg>
